services:
  frontend:
    build:
      context: .
      target: frontend
    image: peche-agent-frontend:latest
    container_name: peche-agent-frontend
    restart: unless-stopped
    ports:
      - "8000:80"
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: .
      target: backend
    image: peche-agent-backend:latest
    container_name: peche-agent-backend
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      MCP_ENABLED: "0"
      PECHE_HOST: 0.0.0.0
      PECHE_PORT: 8000
      DATA_DIR: /app/data
    volumes:
      - peche-runtime:/app/data/runtime
      - peche-cache:/app/data/cache
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  mcp:
    build:
      context: .
      target: backend
    image: peche-agent-backend:latest
    container_name: peche-agent-mcp
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8001:8001"
    command: ["/app/scripts/docker-entrypoint-mcp.sh"]
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DATA_DIR: /app/data
      PECHE_MCP_PORT: "8001"
    volumes:
      - peche-runtime:/app/data/runtime
      - peche-cache:/app/data/cache

volumes:
  peche-runtime:
  peche-cache:
